name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test ScreenVeil.sln --configuration Release

  build:
    needs: test
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained application
        run: dotnet publish ScreenVeil.App/ScreenVeil.App.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output publish/${{ matrix.rid }}
      - name: Package Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath ScreenVeil-win-x64.zip
      - name: Package Linux
        if: matrix.rid == 'linux-x64'
        run: tar -czf ScreenVeil-linux-x64.tar.gz -C publish/linux-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenVeil-${{ matrix.rid }}
          path: ScreenVeil-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ScreenVeil-win-x64.zip ScreenVeil-linux-x64.tar.gz > SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/ScreenVeil-win-x64.zip artifacts/ScreenVeil-linux-x64.tar.gz artifacts/SHA256SUMS.txt --verify-tag --generate-notes
